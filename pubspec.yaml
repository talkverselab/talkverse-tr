name: turkish_universe
description: "터키어유니버스 — 한국 화자 터키어 학습 앱"
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: ^3.11.5

dependencies:
  flutter:
    sdk: flutter
  package_info_plus: ^8.1.1
  cupertino_icons: ^1.0.8

  # Audio
  audioplayers: ^6.1.0

  # Storage
  shared_preferences: ^2.3.2
  path_provider: ^2.1.4
  sqflite: ^2.4.0

  # Util
  csv: ^6.0.0
  flutter_svg: ^2.0.10+1
  flutter_tts: ^4.2.0

  # Drift (SQLite ORM)
  drift: ^2.20.3
  drift_flutter: ^0.2.0
  sqlite3_flutter_libs: ^0.5.24

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.1

  # Drift codegen
  drift_dev: ^2.20.3
  build_runner: ^2.4.13



flutter:
  uses-material-design: true

  assets:
    - assets/data/audio_manifest.json
    - assets/data/dialogues/_meta.json
    - assets/data/dialogues/L1.json
    - assets/data/freq/lang_es_top.csv
    - assets/data/grammar/verbs_core.json
    - assets/data/vocab/travel_words.json
    - assets/data/vocab/travel_expressions.json

flutter_launcher_icons:
  android: true
  ios: true
  remove_alpha_ios: true
  image_path: "assets/icon/icon.png"
  adaptive_icon_background: "#E30A17"
  adaptive_icon_foreground: "assets/icon/icon_foreground.png"
  min_sdk_android: 21
